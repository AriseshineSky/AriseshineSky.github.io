# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: zh-CN

timezone: America/Chicago

# jekyll-seo-tag settings
title: Sky's Notes

tagline: "Engineering blog for GitLab, Ruby and DevOps"

description: >-
  Technical notes on GitLab architecture, Ruby on Rails, and DevOps.

url: "https://ariseshinesky.github.io"

github:
  username: AriseshineSky

social:
  name: Sky Zhao
  email: newkbsky@gmail.com
  links:
    - https://github.com/AriseshineSky
    - mailto:newkbsky@gmail.com

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Web Analytics Settings (Google Analytics from previous GitHub site)
analytics:
  google:
    id: G-DSMEG9N3BH
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode:

cdn:

avatar:

social_preview_image:

toc: true

comments:
  provider: giscus
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo: AriseshineSky/blog-comments
    repo_id: R_kgDOHMJD5g
    category: Announcements
    category_id: DIC_kwDOKwaIcc4CbIv0
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
